name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test suite
        env:
          PYTHON: python
          CI_SKIP_DEPLOYED_UI: "1"   # that suite reads a running deployment's public URL
        run: bash scripts/run_tests.sh
      - name: Boot from a clean environment and self-check
        run: |
          # No .env here: defaults must be enough to start and answer.
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8011 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8011/openapi.json >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8011/openapi.json | grep -q "Resmara API"
          python scripts/selfcheck.py --base http://127.0.0.1:8011
